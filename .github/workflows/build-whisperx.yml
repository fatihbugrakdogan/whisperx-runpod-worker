name: Build & Push whisperx-worker

on:
  push:
    branches: [main]
    paths:
      - "whisperx/**"
      - ".github/workflows/build-whisperx.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: whisperx
          platforms: linux/amd64
          push: true
          tags: fatihbugra/whisperx-worker:latest
          cache-from: type=registry,ref=fatihbugra/whisperx-worker:buildcache
          cache-to: type=registry,ref=fatihbugra/whisperx-worker:buildcache,mode=max
